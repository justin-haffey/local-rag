[package]
name = "localrag-lancedb-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "localrag_lancedb"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "=58.0.0", features = ["ipc"] }
futures = "=0.3.33"
lance-index = "=8.0.0"
lancedb = "=0.31.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
